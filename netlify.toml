# demo1 on Netlify — the whole demo, no backend.
#
# The site publishes this folder as-is, because the page imports demo1's own source at
# runtime: with no server answering, boot.js runs the real request handler in the browser
# (see src/web/public/boot.js). So src/ has to be reachable, not just the built page.
#
# Netlify serves a matching file before consulting these rules, so /src/... resolves
# directly and only unmatched paths fall through.

[build]
  publish = "."

# The page asks for /ui/*, which the Node server maps onto public/ at runtime.
[[redirects]]
  from = "/ui/*"
  to = "/src/web/public/:splat"
  status = 200

# SPA catch-all: every other path is the console itself.
[[redirects]]
  from = "/*"
  to = "/src/web/public/index.html"
  status = 200
